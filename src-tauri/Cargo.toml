[package]
name = "upstream-releases-tracker-lib"
version = "3.4.0"
description = "Track releases from upstream repositories of projects"
authors = ["Mukund Yedunuthala <mukundkash1997@gmx.net>"]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/mukund-yedunuthala/upstream-release-tracker-rs"
homepage = "https://gitlab.com/mukund-yedunuthala/upstream-release-tracker-rs"


[lib]
name = "upstream_releases_tracker_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tauri = { version = "^2", features = [] }
tauri-plugin-opener = "^2"
tauri-plugin-log = "^2"
tauri-plugin-stronghold = "^2"
tauri-plugin-store = "^2"
log = "^0.4"
sha2 = "^0.10"
tokio = { version = "^1", features = ["sync", "rt"] }
serde = { version = "^1.0.219", features = ["derive"] }
serde_json = "^1.0.140"
dirs = "^6.0.0"
reqwest = { version = "^0.13.2", features = ["json"] }
url = "^2"
tracker_libs = { path = "../tracker_libs" }
