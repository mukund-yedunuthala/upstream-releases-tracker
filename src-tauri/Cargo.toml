[package]
name = "upstream-releases-tracker-lib"
version = "3.6.4"
description = "Track releases from upstream repositories of projects"
authors = ["Mukund Yedunuthala <mukundkash1997@gmx.net>"]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mukund-yedunuthala/upstream-releases-tracker"
homepage = "https://github.com/mukund-yedunuthala/upstream-releases-tracker"


[lib]
name = "upstream_releases_tracker_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tauri = { version = "^2", features = [] }
tauri-plugin-opener = "^2"
tauri-plugin-log = "^2"
log = "^0.4"
keyring = { version = "^3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "^1", features = ["sync", "rt", "time"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.150"
dirs = "^6.0.0"
reqwest = { version = "^0.13.2", features = ["json"] }
system-theme = "0.3.0"
url = "^2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
